        <section class="more-info">
            <h2>Follow us</h2>

                    <a href="https://www.instagram.com/timelessedgeclo?igsh=ZXI4OGRtOHK2NThi"

                    <a href="https://wa.me/27670703550"
                       target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp" title="WhatsApp">
                        <svg viewBox="0 0 24 24" aria-hidden="true">

        <section class="contact-form-section">
            <h2>Send us a message</h2>

            <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" data-fallback-email="timelessedgeclothing@gmail.com" novalidate>
                <div class="field">
                    <label for="cf-name">Full name</label>
                    <input type="text" id="cf-name" name="name" required minlength="2" maxlength="60"
                           pattern="[A-Za-z\u00C0-\u017F' \-]{2,60}" autocomplete="name">
                    <span class="error" id="cf-name-error" aria-live="polite"></span>
                </div>

                <div class="field">
                    <label for="cf-email">Email address</label>
                    <input type="email" id="cf-email" name="email" required maxlength="100" autocomplete="email">
                    <span class="error" id="cf-email-error" aria-live="polite"></span>
                </div>

                <div class="field">
                    <label for="cf-phone">Phone number</label>
                    <input type="tel" id="cf-phone" name="phone" required
                           pattern="(\+27|0)[0-9]{9}" placeholder="e.g. 0670703550 or +27670703550" autocomplete="tel">
                    <span class="error" id="cf-phone-error" aria-live="polite"></span>
                </div>

                <div class="field">
                    <label for="cf-type">Type of message</label>
                    <select id="cf-type" name="type" required>
                        <option value="">Select one...</option>
                        <option>General enquiry</option>
                        <option>Order or product question</option>
                        <option>Collaboration</option>
                        <option>Feedback</option>
                        <option>Complaint</option>
                    </select>
                    <span class="error" id="cf-type-error" aria-live="polite"></span>
                </div>

                <div class="field">
                    <label for="cf-message">Message</label>
                    <textarea id="cf-message" name="message" rows="6" required minlength="10" maxlength="1000"></textarea>
                    <span class="char-count" id="cf-count">0 / 1000</span>
                    <span class="error" id="cf-message-error" aria-live="polite"></span>
                </div>
                <div style="display:none" aria-hidden="true">
                    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
                </div>
                <button type="submit" class="submit-btn">Send message</button>
                <p class="form-status" id="cf-status" aria-live="polite"></p>
            </form>
        </section>
    </main>
