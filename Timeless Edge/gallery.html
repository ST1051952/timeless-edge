<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Our gallery</title>
        <link rel="icon" type="image/jpg" href="Images/favicon.jpg">
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <header>
            <img src="Images/indexBackGround.jpg" alt="Timeless Edge logo">
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
                &#9776;
            </button>
            <nav class="navbar">
                <a class="box" href="index.html" title="Go to home page">Home</a>
                <a class="box" href="about.html" title="Learn about us">About</a>
                <a class="box" href="services.html" title="Our services">Services</a>
                <a class="box active" href="gallery.html" title="View our gallery" aria-current="page">Gallery</a>
                <a class="box" href="enquiry.html" title="Send an enquiry">Enquiry</a>
                <a class="box" href="contact.html" title="Our contacts">Contact</a>
            </nav>
            
        </header>
        <main>
            <h1 class="gallery-title">Our Gallery</h1>
            <div class="gallery" id="gallery" aria-label="Gallery of Timeless Edge products">
                <video controls preload="metadata">
                    <source src="Images/Timless fits every where.mp4" type="video/mp4">
                </video>
            </div>

            <dialog id="lightbox" class="lightbox" aria-label="Image viewer">
                <button class="lb-close" type="button" aria-label="Close image viewer"> &times;</button>
                <button class="lb-prev" type="button" aria-label="Previous image">&#10094;</button>
                <figure>
                    <img id="lb-image" src="" alt="">
                    <figcaption id="lb-caption"></figcaption>
                </figure>
                <button class="lb-next" type="button" aria-label="Next image">&#10095;</button>
            </dialog>
        </main>
        <footer>
            &copy;ST10519250
        </footer>
        <script src="JavaScript/script.js" defer></script>
    </body>
</html>
